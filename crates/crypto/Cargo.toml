[package]
name = "islas-crypto"
description = "Sealing and signing under keys derived from an app's secret key: the one implementation behind platform:app/crypto, on the host and in the SDK's native tests."
version.workspace = true
edition.workspace = true
license = "MIT"

[dependencies]
base64 = "0.22"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hmac = "0.13"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
secrecy = "0.10"
sha2 = "0.11"
zeroize = "1"
